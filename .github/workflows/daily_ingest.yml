name: Daily Data Ingestion (Stock + DART + Sentiment)

on:
  schedule:
    # 평일(월~금) 한국시간 저녁 8:00 (UTC 11:00) — 장 마감 및 장후 공시 완료 후
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 일간 증분 데이터 수집 (주가 · 공시 · 심리지표)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python main.py --mode all --days 5
          python collectors/sentiment_collector.py --days 2000

      - name: 5. DB 변경사항 자동 저장 (Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add kr_quant.db
          git diff --staged --quiet || git commit -m "chore(data): daily market & disclosure update"
          git push