name: Weekly Analysis & Report (v2 Data Lake)

on:
  schedule:
    # 매주 월요일 한국시간 오전 8:30 (일요일 UTC 23:30)
    - cron: '30 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-analysis-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Hugging Face에서 v2 data_lake 내려받기
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python db/hf_sync.py --pull

      - name: 5. 최근 10일 누락 보정 수집 (주가 · 국내 공시 · 심리지표)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          python main.py --mode krx --days 10
          python collectors/sentiment_collector.py --days 2000
          python collectors/krx_deriv_collector.py
          python db/hf_sync.py --sync-sentiment
          python collectors/v2_market_collector.py --market ALL --days 10
          python collectors/v2_dart_collector.py --days 10

      - name: 6. 보정된 data_lake를 Hugging Face로 업로드
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python db/hf_sync.py --push --message "chore(weekly): sync v2 data_lake"

      - name: 7. v2 전 종목 통계 분석 및 텔레그램 주간 브리핑 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analysis/v2_analysis.py --send-telegram --attach-report

      - name: 8. 주간 리포트 산출물(outputs/v2/) 및 기준 DB 커밋
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add kr_quant.db outputs/v2/
          git diff --staged --quiet || git commit -m "chore(report): weekly v2 full-market analysis & report"
          git push